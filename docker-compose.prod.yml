## Production stack.
##
## PostgreSQL and Redis run on the HOST (installed via apt), not as containers.
## Containers reach them through `host.docker.internal`, which `extra_hosts`
## maps to the Docker bridge gateway (172.17.0.1).
##
## The host services must listen on that bridge and be firewalled to it.
## See VPS-DEPLOYMENT.md for the full setup.

services:

    nginx:
        image: jc21/nginx-proxy-manager:latest
        container_name: Rexial_Nginx
        restart: always
        ports:
            - "80:80"
            - "443:443"
            # Admin UI on localhost only - tunnel in:
            #   ssh -L 8181:localhost:81 user@your-vps
            - "127.0.0.1:81:81"

        volumes:
            - nginx_data:/data
            - letsencrypt:/etc/letsencrypt

        networks:
            - rexial-network

        depends_on:
            - frontend
            - backend
            - ws-server
            - genai

    frontend:
        build:
            context: .
            dockerfile: apps/frontend/Dockerfile.prod
        image: codeheist/rexial-frontend:${IMAGE_TAG:-latest}
        container_name: rexial-frontend-prod
        restart: always
        networks:
            - rexial-network
        depends_on:
            - backend
            - ws-server
            - genai

    backend:
        build:
            context: .
            dockerfile: apps/http-server/Dockerfile.prod
            args:
                DATABASE_URL: ${DATABASE_URL}
        image: codeheist/rexial-http-server:${IMAGE_TAG:-latest}
        container_name: rexial-http-server-prod
        restart: always
        env_file:
            - .env.prod

        networks:
            - rexial-network
        # Reach PostgreSQL and Redis running on the host.
        extra_hosts:
            - "host.docker.internal:host-gateway"

        # now run the migrations
        command: >
            sh -c "pnpm --filter @repo/db run db:generate:prod &&
                   pnpm --filter @repo/db run db:migrate &&
                   pnpm run start"

    ws-server:
        build:
            context: .
            dockerfile: apps/ws-server/Dockerfile.prod
            args:
                DATABASE_URL: ${DATABASE_URL}
        image: codeheist/rexial-ws-server:${IMAGE_TAG:-latest}
        container_name: rexial-ws-server-prod
        restart: always
        env_file:
            - .env.prod
        networks:
            - rexial-network
        # Reach PostgreSQL and Redis running on the host.
        extra_hosts:
            - "host.docker.internal:host-gateway"
        command: >
            sh -c "pnpm --filter @repo/db run db:generate:prod &&
                   pnpm run start"

    genai:
        build:
            context: .
            dockerfile: apps/genAI/Dockerfile.prod
        image: codeheist/rexial-genai:${IMAGE_TAG:-latest}
        container_name: rexial-genai-prod
        restart: always
        env_file:
            - .env.prod
        environment:
            - UPLOAD_DIR=/data/uploads
        volumes:
            - genai_uploads:/data/uploads
        networks:
            - rexial-network
        healthcheck:
            test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 60s

networks:
    rexial-network:
        driver: bridge

volumes:
    genai_uploads:
    nginx_data:
    letsencrypt:
